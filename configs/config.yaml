seed: 42
data:
  raw_dir: data/raw
  processed_dir: data/processed
  image_size: 224
  gallery_fraction: 0.10
  query_fraction: 0.10
  val_fraction: 0.10
model:
  backbone: resnet18
  pretrained: true
  embedding_dim: 256
  freeze_backbone_epochs: 1
training:
  epochs: 15
  batch_size: 32
  images_per_class: 4
  lr: 0.0001
  weight_decay: 0.0001
  margin: 0.30
  num_workers: 2
  amp: true
evaluation:
  top_k: [1, 5, 10]
  threshold_grid_points: 201
